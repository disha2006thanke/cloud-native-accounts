
[nosetests]
verbosity = 2
with-coverage = 1
cover-package = service
cover-erase = 1

[coverage:run]
branch = True
source = service

[coverage:report]
show_missing = True
skip_covered = True

[flake8]
max-line-length = 100
exclude = .git,__pycache__,venv,.venv

[pylint.MASTER]
ignore = .git,__pycache__,venv,.venv

[pylint.messages_control]
disable = C0114,C0115,C0116
